<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" fill="none" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Samisthi Aranya Resorts</title>
  <desc id="logoDesc">Cabin and nature emblem with rising sun, trees, and birds in the Obsidian Rose palette for Samisthi Aranya Resorts — Where Nature Meets Luxury.</desc>
  <defs>
    <linearGradient id="sunGrad" x1="320" y1="28" x2="320" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="65%" stop-color="#E79AB2"/>
      <stop offset="100%" stop-color="#682E4E"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="230" y1="74" x2="380" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#E79AB2"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="120" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#120D0F" stop-opacity="0"/>
      <stop offset="22%" stop-color="#682E4E"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="78%" stop-color="#682E4E"/>
      <stop offset="100%" stop-color="#120D0F" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Subtle outer arch frame -->
  <path d="M196 138 A128 128 0 0 1 444 138" stroke="#682E4E" stroke-width="1.2" stroke-opacity="0.65"/>
  <path d="M206 138 A118 118 0 0 1 434 138" stroke="#C9A227" stroke-width="0.75" stroke-opacity="0.45"/>

  <!-- Rising Sun -->
  <circle cx="332" cy="78" r="32" fill="url(#sunGrad)" opacity="0.92"/>

  <!-- Distant Birds -->
  <path d="M278 48 Q283 43 288 47 Q293 43 298 48" stroke="#F6E7EC" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85"/>
  <path d="M364 42 Q368 38 372 41 Q376 38 380 42" stroke="#E79AB2" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.85"/>

  <!-- Left Canopy Tree (Stylized Nature Emblem in Gold & Rose) -->
  <g stroke="#C9A227" stroke-linecap="round" fill="none">
    <path d="M228 134 C229 116 232 102 230 84" stroke-width="3.2"/>
    <path d="M230 104 C218 96 210 92 202 90" stroke-width="2.2"/>
    <path d="M230 96 C240 88 248 83 256 80" stroke-width="2.2"/>
    <path d="M229 88 C222 79 216 74 210 72" stroke-width="1.8"/>
  </g>
  <ellipse cx="204" cy="86" rx="16" ry="7" fill="#682E4E" opacity="0.85"/>
  <ellipse cx="226" cy="70" rx="22" ry="9" fill="#C9A227" opacity="0.88"/>
  <ellipse cx="250" cy="77" rx="18" ry="7.5" fill="#E79AB2" opacity="0.82"/>
  <ellipse cx="218" cy="78" rx="15" ry="6" fill="#F6E7EC" opacity="0.35"/>

  <!-- Right Canopy Tree -->
  <g stroke="#C9A227" stroke-linecap="round" fill="none">
    <path d="M408 134 C406 118 404 105 406 88" stroke-width="2.8"/>
    <path d="M405 106 C395 99 389 94 383 92" stroke-width="2"/>
    <path d="M406 98 C415 91 422 87 429 85" stroke-width="2"/>
  </g>
  <ellipse cx="386" cy="88" rx="15" ry="6.5" fill="#E79AB2" opacity="0.82"/>
  <ellipse cx="408" cy="76" rx="20" ry="8" fill="#C9A227" opacity="0.88"/>
  <ellipse cx="428" cy="83" rx="15" ry="6.5" fill="#682E4E" opacity="0.85"/>

  <!-- Resort Cabin Emblem -->
  <path d="M248 108 L306 76 L364 108" stroke="url(#roofGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M262 108 L306 84 L350 108 Z" fill="#682E4E" fill-opacity="0.55"/>
  <rect x="266" y="108" width="80" height="26" rx="1.5" fill="#120D0F" stroke="#C9A227" stroke-width="1.6"/>
  <!-- Lit Cabin Windows -->
  <rect x="278" y="114" width="11" height="11" rx="1" fill="#C9A227"/>
  <rect x="293" y="114" width="11" height="11" rx="1" fill="#F6E7EC" fill-opacity="0.9"/>
  <line x1="283.5" y1="114" x2="283.5" y2="125" stroke="#120D0F" stroke-width="1.2"/>
  <line x1="278" y1="119.5" x2="289" y2="119.5" stroke="#120D0F" stroke-width="1.2"/>
  <rect x="318" y="113" width="16" height="21" rx="1" fill="#682E4E" stroke="#E79AB2" stroke-width="1.1"/>

  <!-- Flowing Landscape Horizon -->
  <path d="M168 138 Q248 126 320 136 T472 138" stroke="url(#ruleGrad)" stroke-width="2.2" fill="none"/>
  <path d="M192 144 Q268 135 320 142 T448 144" stroke="#E79AB2" stroke-width="1" stroke-opacity="0.5" fill="none"/>

  <!-- Brand Wordmark: SAMISTHI -->
  <text x="320" y="184" text-anchor="middle" fill="#F6E7EC" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" letter-spacing="10">SAMISTHI</text>

  <!-- Sub-wordmark: ARANYA RESORTS -->
  <line x1="150" y1="205" x2="212" y2="205" stroke="#C9A227" stroke-width="1" stroke-opacity="0.7"/>
  <text x="320" y="210" text-anchor="middle" fill="#E79AB2" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-weight="400" letter-spacing="7.5">ARANYA RESORTS</text>
  <line x1="428" y1="205" x2="490" y2="205" stroke="#C9A227" stroke-width="1" stroke-opacity="0.7"/>

  <!-- Twin Leaf Ornament -->
  <path d="M320 228 C313 221 306 221 304 226 C306 231 313 231 320 228 Z" fill="#C9A227"/>
  <path d="M320 228 C327 221 334 221 336 226 C334 231 327 231 320 228 Z" fill="#E79AB2"/>
  <circle cx="320" cy="228" r="2" fill="#F6E7EC"/>
</svg>
